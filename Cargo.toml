[package]
name = "wyrite"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
dotenvy = "0.15.7"
handlebars = { version = "6.4.3", features = ["dir_source"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time", "uuid", "macros", "migrate"] }
time = { version = "0.3.54", features = ["serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.0", features = ["fs"] }
uuid = { version = "1.24.0", features = ["serde"] }

[workspace.metadata.bacon]
background = false
on_change_strategy = "kill_then_restart"
